[package]
name = "locus-app"
version = "0.1.0"
edition = "2021"
description = "LOCUS - Local-First AI Coding Assistant"
authors = ["LOCUS Team"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-global-shortcut = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
notify = { workspace = true }
tokio-stream = { workspace = true }
regex = { workspace = true }
num_cpus = { workspace = true }
once_cell = { workspace = true }
dirs = "6.0.0"

locus-core = { path = "../crates/locus-core" }
locus-fs = { path = "../crates/locus-fs" }
locus-templates = { path = "../crates/locus-templates" }
locus-context = { path = "../crates/locus-context" }
locus-network = { path = "../crates/locus-network" }
locus-agents = { path = "../crates/locus-agents" }
locus-llm = { path = "../crates/locus-llm" }
locus-research = { path = "../crates/locus-research" }
locus-plugins = { path = "../crates/locus-plugins" }
