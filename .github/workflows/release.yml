name: "Release LOCUS"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
          - platform: "macos-13"
            target: "x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "src/package-lock.json"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev javascriptcoregtk-4.1-dev

      - name: Install frontend dependencies
        run: |
          cd src
          npm install

      - name: Build frontend
        run: |
          cd src
          npm run build

      - name: Build and Package with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: "src-tauri"
          tagName: ${{ github.ref_name || inputs.version }}
          releaseName: "LOCUS ${{ github.ref_name || inputs.version }}"
          releaseBody: |
            ### 🚀 LOCUS — Sovereign Local-First AI Coding Assistant

            #### ✨ What's Included:
            - **Sovereign Ambient HUD** (<3ms wake via `Alt+Space`)
            - **Formal Verification Engine** ($wp$ Calculus & Zero-Panic Policy)
            - **Native System Tray & Background Service Integration**
            - **Zero Memory Leaks & 38.5MB Constant Footprint**
            - **Air-Gap QR Cryptographic Sync**

            #### 📦 Downloadable Platform Binaries:
            - **Windows**: `.msi` (Installer) & `locus-app.exe`
            - **macOS**: `.dmg` / `.app` (Apple Silicon & Intel)
            - **Linux**: `.deb` & `.AppImage`
            - **Auto-Updater**: `latest.json` with Minisign Ed25519 signature
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
