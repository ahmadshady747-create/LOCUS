name: "CI — Workspace Integrity & Tests"

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
  pull_request:
    branches:
      - main
      - master

jobs:
  test-rust-workspace:
    name: "Rust Test Suite"
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Run All Workspace Unit & Integration Tests
        run: cargo test --workspace --lib

  build-frontend:
    name: "Frontend Typecheck & Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "src/package.json"

      - name: Install Dependencies
        run: |
          cd src
          npm install

      - name: Typecheck & Production Bundle Build
        run: |
          cd src
          npm run build
