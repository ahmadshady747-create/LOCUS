name: "CI — Systems Engine Verification & Tests"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-engine:
    name: "Rust Systems Test & Benchmarks (${{ matrix.os }})"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Run All Unit & Integration Tests
        run: cargo test --all-targets

      - name: Run Release Benchmarks Suite
        run: cargo test --release --test benchmarks -- --nocapture
