[package]
name = "locus-engine"
version = "0.3.1"
edition = "2021"
authors = ["Ahmed Shadi"]
description = "Deterministic AST Verification, Cross-File Semantic Graph & Surgical Patching Engine in Pure Rust"
license = "BSL-1.1"
repository = "https://github.com/ahmadshady747-create/LOCUS"
homepage = "https://github.com/ahmadshady747-create/LOCUS"
readme = "README.md"

[dependencies]
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
thiserror = "1.0"

[[bin]]
name = "locus"
path = "src/main.rs"

[lib]
name = "locus_engine"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
