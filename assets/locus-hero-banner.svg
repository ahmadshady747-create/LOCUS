<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0d12" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#388bfd" />
      <stop offset="100%" stop-color="#1f6feb" />
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <linearGradient id="accent-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#79c0ff" />
      <stop offset="100%" stop-color="#56d364" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Subtle Ambient Geometric Grid Lines -->
  <g opacity="0.08" stroke="#58a6ff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="900" y1="0" x2="900" y2="320" />
  </g>

  <!-- Stylized Shield & Core Icon -->
  <g transform="translate(110, 80)">
    <!-- Outer Glow Shield -->
    <path d="M 50 0 L 100 25 L 100 85 C 100 130 50 160 50 160 C 50 160 0 130 0 85 L 0 25 Z"
          fill="none" stroke="#58a6ff" stroke-width="3" opacity="0.4" filter="url(#glow)" />
    <!-- Main Shield -->
    <path d="M 50 0 L 100 25 L 100 85 C 100 130 50 160 50 160 C 50 160 0 130 0 85 L 0 25 Z"
          fill="#161b22" stroke="url(#cyan-glow)" stroke-width="2.5" />
    <!-- Inner Core Geometry / Invariant Hexagon -->
    <polygon points="50,35 78,50 78,85 50,100 22,85 22,50"
             fill="#0d1117" stroke="url(#emerald-glow)" stroke-width="2" />
    <!-- Central Kernel Core Dot -->
    <circle cx="50" cy="67.5" r="10" fill="#58a6ff" filter="url(#soft-glow)" />
    <!-- Circuit lines radiating out -->
    <line x1="50" y1="15" x2="50" y2="35" stroke="#58a6ff" stroke-width="2" />
    <line x1="10" y1="85" x2="22" y2="85" stroke="#3fb950" stroke-width="2" />
    <line x1="90" y1="85" x2="78" y2="85" stroke="#3fb950" stroke-width="2" />
    <line x1="50" y1="100" x2="50" y2="140" stroke="#58a6ff" stroke-width="2" />
  </g>

  <!-- Typography & Titles -->
  <g transform="translate(250, 95)">
    <!-- LOCUS Main Title -->
    <text x="0" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="52" font-weight="900" letter-spacing="4" fill="url(#accent-text)">LOCUS</text>
    <text x="215" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="14" font-weight="700" letter-spacing="1.5" fill="#3fb950" opacity="0.9">PURE RUST SOVEREIGN MICROKERNEL</text>

    <!-- Subtitle -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="20" font-weight="400" fill="#8b949e">
      Sovereign Ambient HUD &amp; Invariant-Verified Microkernel in Pure Rust
    </text>

    <!-- 3 Metric Pill Badges -->
    <g transform="translate(0, 115)">
      <!-- Badge 1: RAM -->
      <g transform="translate(0, 0)">
        <rect width="180" height="38" rx="19" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
        <circle cx="20" cy="19" r="5" fill="#3fb950" filter="url(#soft-glow)" />
        <text x="35" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="14" font-weight="700" fill="#f0f6fc">&lt; 38.5 MB RAM</text>
      </g>

      <!-- Badge 2: Wake Latency -->
      <g transform="translate(200, 0)">
        <rect width="180" height="38" rx="19" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
        <circle cx="20" cy="19" r="5" fill="#58a6ff" filter="url(#soft-glow)" />
        <text x="35" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="14" font-weight="700" fill="#f0f6fc">&lt; 2.5 ms Wake</text>
      </g>

      <!-- Badge 3: Binary Size -->
      <g transform="translate(400, 0)">
        <rect width="195" height="38" rx="19" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
        <circle cx="20" cy="19" r="5" fill="#bc8cff" filter="url(#soft-glow)" />
        <text x="35" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="14" font-weight="700" fill="#f0f6fc">23.0 MB Binary</text>
      </g>

      <!-- Badge 4: Test Suite -->
      <g transform="translate(615, 0)">
        <rect width="190" height="38" rx="19" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
        <circle cx="20" cy="19" r="5" fill="#e3b341" filter="url(#soft-glow)" />
        <text x="35" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
              font-size="14" font-weight="700" fill="#f0f6fc">191/191 Tests (100%)</text>
      </g>
    </g>
  </g>
</svg>
