<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <linearGradient id="bg-overlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="100%" stop-color="#040608" />
    </linearGradient>
    <linearGradient id="hud-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="glow-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>
    <filter id="hud-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Environment (Blurred Desktop Mock) -->
  <rect width="1000" height="520" fill="url(#bg-overlay)" />

  <!-- Background Code Lines (Ghost Ambient Text) -->
  <g opacity="0.15" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12" fill="#8b949e">
    <text x="40" y="40">fn main() -> Result&lt;()&gt; {</text>
    <text x="60" y="60">let runtime = LocusMicrokernel::init(Config::default())?;</text>
    <text x="60" y="80">let verifier = QuickVerifierBridge::new();</text>
    <text x="60" y="100">info!("LOCUS Sovereign Daemon initialized on port 8080");</text>
    <text x="60" y="440">runtime.block_on_signal()?;</text>
    <text x="40" y="460">Ok(())</text>
    <text x="40" y="480">}</text>
  </g>

  <!-- Spotlight HUD Floating Container -->
  <g transform="translate(100, 40)" filter="url(#hud-shadow)">
    <!-- Container Body -->
    <rect width="800" height="440" rx="16" fill="url(#hud-card)" stroke="#30363d" stroke-width="1.5" />

    <!-- Top Accent Glow Line -->
    <rect x="0" y="0" width="800" height="3" rx="1.5" fill="url(#glow-border)" />

    <!-- Window Header Bar -->
    <g transform="translate(24, 20)">
      <!-- Window Controls -->
      <circle cx="0" cy="8" r="6" fill="#ff5f56" />
      <circle cx="20" cy="8" r="6" fill="#ffbd2e" />
      <circle cx="40" cy="8" r="6" fill="#27c93f" />

      <!-- Title -->
      <text x="70" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="14" font-weight="700" fill="#f0f6fc">LOCUS Ambient HUD</text>
      <text x="215" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="12" font-weight="500" fill="#8b949e">v0.1.0 (Standalone)</text>

      <!-- Latency Badge -->
      <g transform="translate(640, -4)">
        <rect width="88" height="24" rx="12" fill="#0d1117" stroke="#3fb950" stroke-width="1" />
        <circle cx="12" cy="12" r="3.5" fill="#3fb950" />
        <text x="22" y="16" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#3fb950">0.04ms ⚡</text>
      </g>
    </g>

    <!-- Search / Prompt Input Box -->
    <g transform="translate(24, 60)">
      <rect width="752" height="54" rx="10" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5" />
      <text x="18" y="33" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="700" fill="#58a6ff">&gt;</text>
      <text x="38" y="33" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="600" fill="#f0f6fc">/fix</text>
      <text x="80" y="33" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="400" fill="#79c0ff">@compiler_probe::parse_cargo_json</text>
      <line x1="410" y1="18" x2="410" y2="36" stroke="#58a6ff" stroke-width="2" />
    </g>

    <!-- Real-time Invariant Guard Card -->
    <g transform="translate(24, 130)">
      <rect width="752" height="74" rx="10" fill="#0d1117" stroke="#238636" stroke-width="1" />
      <!-- Icon & Status -->
      <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#3fb950">🛡️ AST Invariant Guard: PASS (0 Violations)</text>
      <text x="20" y="54" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="400" fill="#8b949e">
        Verified: [Div-by-Zero: Safe] | [Bounds: Safe] | [Unwrap: Guarded] | [Async Mutex: Ok] | [Time: 0.028ms]
      </text>
      <!-- Mini Check Mark -->
      <circle cx="720" cy="37" r="14" fill="#1f6feb" opacity="0.2" />
      <text x="714" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#58a6ff">✓</text>
    </g>

    <!-- Action / Patch Diff Card -->
    <g transform="translate(24, 218)">
      <rect width="752" height="150" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <!-- Action Header -->
      <g transform="translate(18, 26)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f0f6fc">⚡ Action: Atomic Hunk Applied</text>
        <text x="225" y="0" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#8b949e">(SHA-256: 8f4e2a...c31b)</text>
      </g>
      <!-- Diff Snippet Lines -->
      <g transform="translate(18, 48)" font-family="'JetBrains Mono', Consolas, monospace" font-size="12">
        <rect x="0" y="0" width="716" height="24" fill="#3fb950" opacity="0.1" rx="4" />
        <text x="10" y="16" fill="#3fb950">+ if denominator != 0 { Ok(val / denominator) } else { Err("ZeroDiv") }</text>

        <rect x="0" y="28" width="716" height="24" fill="#f85149" opacity="0.1" rx="4" />
        <text x="10" y="44" fill="#f85149">- Ok(val / denominator)</text>

        <text x="10" y="72" fill="#8b949e">  // Invariant verified in &lt;0.03ms. Shadow write committed to disk atomically.</text>
      </g>
    </g>

    <!-- Telemetry Footer Bar -->
    <g transform="translate(24, 385)">
      <line x1="0" y1="0" x2="752" y2="0" stroke="#21262d" stroke-width="1" />
      <g transform="translate(10, 26)" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#8b949e">
        <text x="0" y="0">RAM: <tspan fill="#3fb950" font-weight="700">34.2 MB</tspan></text>
        <text x="130" y="0">|</text>
        <text x="150" y="0">Tokens Saved: <tspan fill="#58a6ff" font-weight="700">38.4%</tspan></text>
        <text x="310" y="0">|</text>
        <text x="330" y="0">Core: <tspan fill="#bc8cff" font-weight="700">Air-Gapped Sovereign</tspan></text>
        <text x="540" y="0">Shortcut: <tspan fill="#f0f6fc">Alt + Space</tspan></text>
      </g>
    </g>
  </g>
</svg>
