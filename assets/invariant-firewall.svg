<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
  <defs>
    <linearGradient id="firewall-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="gate-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="fw-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="400" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

  <!-- Flow Step 1: Code Proposal -->
  <g transform="translate(30, 150)" filter="url(#fw-shadow)">
    <rect width="160" height="100" rx="12" fill="url(#firewall-card)" stroke="#58a6ff" stroke-width="1.5" />
    <text x="16" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#58a6ff">Input Proposal</text>
    <text x="16" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f0f6fc">AI Token Stream</text>
    <text x="16" y="68" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8b949e">or HUD /fix Intent</text>
    <text x="16" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#e3b341">⚡ Unverified Code</text>
  </g>

  <!-- Arrow 1 -> Gate -->
  <g stroke="#58a6ff" stroke-width="2" fill="none">
    <line x1="190" y1="200" x2="240" y2="200" />
    <polygon points="240,195 250,200 240,205" fill="#58a6ff" />
  </g>

  <!-- Step 2: In-Memory AST Safety Gate (Central 6-Pass Engine) -->
  <g transform="translate(250, 40)" filter="url(#fw-shadow)">
    <rect width="450" height="320" rx="16" fill="url(#gate-grad)" stroke="#388bfd" stroke-width="2" />
    <!-- Gate Header -->
    <rect x="0" y="0" width="450" height="42" rx="16" fill="#1e293b" />
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#f0f6fc">🛡️ In-Memory AST Invariant Gate</text>
    <text x="320" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#3fb950">&lt; 0.05ms Pass</text>

    <!-- 6 Invariant Passes Grid -->
    <!-- Pass 1: Div-by-Zero -->
    <g transform="translate(20, 56)">
      <rect width="195" height="72" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#58a6ff">1. Div-by-Zero Guard</text>
      <text x="12" y="40" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8b949e">x / y ➔ y != 0 Check</text>
      <text x="12" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#3fb950">✓ Prevents SIGFPE</text>
    </g>

    <!-- Pass 2: Array Bounds -->
    <g transform="translate(235, 56)">
      <rect width="195" height="72" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#58a6ff">2. Array Bounds Guard</text>
      <text x="12" y="40" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8b949e">arr[i] ➔ i &lt; len Check</text>
      <text x="12" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#3fb950">✓ Prevents Index Panic</text>
    </g>

    <!-- Pass 3: Unsafe Unwrap -->
    <g transform="translate(20, 140)">
      <rect width="195" height="72" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#58a6ff">3. Unsafe Unwrap / Expect</text>
      <text x="12" y="40" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8b949e">Option/Result Validation</text>
      <text x="12" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#3fb950">✓ Enforces is_some/is_ok</text>
    </g>

    <!-- Pass 4: Async Mutex Deadlock -->
    <g transform="translate(235, 140)">
      <rect width="195" height="72" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#58a6ff">4. Async Mutex Deadlock</text>
      <text x="12" y="40" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8b949e">Sync Mutex Across Await</text>
      <text x="12" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#3fb950">✓ Prevents Thread Starve</text>
    </g>

    <!-- Pass 5: Regex ReDoS -->
    <g transform="translate(20, 224)">
      <rect width="195" height="72" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#58a6ff">5. Regex ReDoS Shield</text>
      <text x="12" y="40" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8b949e">Catastrophic Backtrack</text>
      <text x="12" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#3fb950">✓ Blocks O(2^n) Regex</text>
    </g>

    <!-- Pass 6: Null Dereference -->
    <g transform="translate(235, 224)">
      <rect width="195" height="72" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#58a6ff">6. TS/JS Null Dereference</text>
      <text x="12" y="40" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8b949e">Deep Property a.b.c</text>
      <text x="12" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#3fb950">✓ Enforces Optional (?.)</text>
    </g>
  </g>

  <!-- Flow Output Branches -->

  <!-- Branch 1: Safe -> Atomic Write -->
  <g stroke="#3fb950" stroke-width="2" fill="none">
    <line x1="700" y1="120" x2="770" y2="120" />
    <polygon points="770,115 780,120 770,125" fill="#3fb950" />
  </g>
  <g transform="translate(780, 70)" filter="url(#fw-shadow)">
    <rect width="190" height="100" rx="12" fill="url(#firewall-card)" stroke="#3fb950" stroke-width="1.5" />
    <text x="16" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#3fb950">✅ VERIFIED SAFE</text>
    <text x="16" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f0f6fc">Atomic Shadow Write</text>
    <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#8b949e">Myers Hunk Applied</text>
    <text x="16" y="86" font-family="'JetBrains Mono', monospace" font-size="9" fill="#58a6ff">SHA-256 Committed</text>
  </g>

  <!-- Branch 2: Unsafe -> Counterexample Self-Healing -->
  <g stroke="#f85149" stroke-width="2" fill="none">
    <line x1="700" y1="280" x2="770" y2="280" />
    <polygon points="770,275 780,280 770,285" fill="#f85149" />
  </g>
  <g transform="translate(780, 230)" filter="url(#fw-shadow)">
    <rect width="190" height="100" rx="12" fill="url(#firewall-card)" stroke="#f85149" stroke-width="1.5" />
    <text x="16" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f85149">❌ INVARIANT FAILED</text>
    <text x="16" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f0f6fc">Counterexample Loop</text>
    <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#8b949e">Self-Healing Prompt</text>
    <text x="16" y="86" font-family="'JetBrains Mono', monospace" font-size="9" fill="#e3b341">Disk Never Touched</text>
  </g>
</svg>
